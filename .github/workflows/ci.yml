name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（CI 用 headless 版 OpenCV）
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest opencv-python-headless

      - name: 验收门（与本地同一条命令）
        run: python scripts/check.py

      - name: 上传证据（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
